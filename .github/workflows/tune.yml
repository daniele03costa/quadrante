name: Taratura del modello

# Avvio manuale dal tab "Actions". Prova le varianti del modello sui rendimenti reali,
# salva la migliore in scripts/model_config.json e ripubblica il sito.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Ripristina cache prezzi e universo
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            data/universe.json
            data/meta.json
          key: dati-${{ github.run_id }}
          restore-keys: dati-
      - name: Prepara universo e prezzi (se la cache è vuota)
        run: |
          if [ ! -f data/universe.json ] || [ ! -f cache/prices.parquet ]; then python scripts/update_data.py; fi
      - name: Taratura
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/tune.py
      - name: Salva la configurazione scelta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/model_config.json scripts/tuning_report.json
          git commit -m "Taratura del modello $(date -u +'%Y-%m-%d')" || echo "Nessuna modifica"
          # il ramo può essere avanzato durante la taratura: riallinea prima di salvare
          git pull --rebase origin main
          git push
