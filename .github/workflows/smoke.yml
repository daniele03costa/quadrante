name: Prova veloce

# Avvio manuale dal tab "Actions" (5-10 minuti). Prende pochi titoli da ogni fonte
# (Wikipedia, NASDAQ, Yahoo, FRED, CFTC, ForexFactory), esegue tutto il calcolo
# e stampa nel log una tabella "FONTE / TITOLI / CON PREZZI". Non pubblica nulla.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Prova veloce
        run: |
          set -o pipefail
          python scripts/update_data.py --smoke 2>&1 | tee run.log
      # il riepilogo diventa un'annotazione dell'esecuzione (visibile nella pagina della run e via API)
      - name: Riepilogo fonti
        if: always()
        run: python scripts/annotate.py run.log data/sources_report.json
